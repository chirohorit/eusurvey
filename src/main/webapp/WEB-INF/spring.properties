showecas=false
casoss=false
ecashost=
ecaslogout=
ecasvalidationhost=
## LDAP configuration
LdapUrl=
LdapContextFactory=
LdapSecurityPrincipal=
LdapSecurityCredentials=
LdapSecurityAuthentication=
ldap.search.user.format=
