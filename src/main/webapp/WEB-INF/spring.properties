# OSS PROPERTIES
## CONTEXT configuration
contextpath=/eusurvey
spring.main.allow-circular-references=false
## JDBC configuration
mysql.majorversion=8
app.jdbc.driverClassName=com.mysql.cj.jdbc.Driver
app.jdbc.url=jdbc:mysql://localhost:3309/eusurveydb_rev3?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
app.jdbc.username=eusurveyuser
app.jdbc.password=eusurveyuser
## Reporting database: not needed if enablereportingdatabase is set to false (recommended)
enablereportingdatabase=false
reporting.jdbc.driverClassName=com.mysql.cj.jdbc.Driver
reporting.jdbc.url=jdbc:mysql://localhost:3309/eusurveyreportdb?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
reporting.jdbc.username=eusurveyruser
reporting.jdbc.password=eusurveyruser
## PROXY configuration
proxy.host=
proxy.port=8081
proxy.user=
proxy.password=
proxy.nonProxyHosts=localhost
## DEFAULT USERS configuration
admin.user=admin
admin.password=adminpw
stress.user=
stress.password=
## FILE SYSTEM configuration
archive.fileDir=eusurveytemp/archive/
export.tempFileDir=eusurveytemp/tmp/
export.fileDir=eusurveytemp/tmp/files/
export.poolSize=2
filesystem.surveys=eusurveytemp/surveys/
filesystem.users=eusurveytemp/users/
filesystem.archive=eusurveytemp/archive/
server.prefix=http://localhost:8080/eusurvey/
export.xsllink=http://localhost:8080/eusurvey/resources/xsl/eusurvey.xsl
pdfserver.prefix=http://localhost:8080/eusurvey/
## ARCHITECTURE configuration
isworkerserver=false
useworkerserver=false
workerserverurl=http://localhost:8080/eusurvey/
host.executing.task=
host.executing.ldaptask=
host.executing.todotask=
workerpermission=hasAnyRole('ROLE_USER_ADMIN','ROLE_RIGHT_ADMIN')
## MAIL configuration
mail.mailPoolSize=2
smtpserver=smtp.server.com
smtp.port=25
sender=info@myServer.com
publicsurveynotification=AnEmailAdress@DontLeaveEmpty.empty
server.mt.response.callback=http://localhost:8080/eusurvey/
support.smIncidentHost=
